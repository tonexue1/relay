<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; base-uri 'none'; form-action 'none'">
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;background:white}
  </style>
</head>
<body>
<iframe id="artifact" title="Artifact preview" sandbox="allow-scripts allow-forms"></iframe>
<script>
(() => {
  'use strict';
  const MAX_MESSAGE = 8192;
  let ready = false;
  setTimeout(() => {
    if (!ready) report({relayArtifact:true,kind:'blank_timeout',message:'DOM ready not received'});
  }, 3000);
  const report = value => {
    try {
      const json = JSON.stringify(value);
      if (json.length <= MAX_MESSAGE && window.relayDiagnostics) {
        window.relayDiagnostics.postMessage(json);
      }
    } catch (_) {}
  };
  window.addEventListener('message', event => {
    if (event.source !== document.getElementById('artifact').contentWindow) return;
    const data = event.data;
    if (!data || data.relayArtifact !== true || typeof data.kind !== 'string') return;
    if (data.kind === 'dom_ready') ready = true;
    report(data);
  });
  const encoded = location.hash.slice(1);
  if (!encoded) {
    report({relayArtifact:true,kind:'error',message:'missing artifact body'});
    return;
  }
  try {
    document.getElementById('artifact').srcdoc = decodeURIComponent(escape(atob(encoded)));
  } catch (error) {
    report({relayArtifact:true,kind:'error',message:String(error)});
  }
})();
</script>
</body>
</html>
