# Memory budget is the binding constraint on this box: 32 GB RAM but a fixed 4 GB
# pagefile caps the Windows commit limit at 36 GB, and the IDEs already hold most of
# it. Building llama.cpp on top of that OOM-kills the daemon, so every concurrency
# knob below is deliberately turned down -- see also CMAKE_BUILD_PARALLEL_LEVEL in
# relay/ondevice. HeapBaseMinAddress keeps the compressed-oops heap from blocking
# native heap growth, which is what the JVM crash log pointed at.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:HeapBaseMinAddress=2g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
android.nonTransitiveRClass=true
android.native.buildOutput=verbose
