space_id: "novel:linwan"
title: "林晚"
total_chapters: 3

premise: >-
  南宋临安。绣娘林晚等一个人等了三年。
  那个人当年说去洛阳赴任，开春就回来接她，之后再无消息。
  她攒够了盘缠，决定自己去洛阳。

ending_direction: >-
  林晚见到沈砚，也弄清了他为什么没回来。
  她没有原谅，也没有恨——她只是终于可以走了。

style: "白描，节制，少形容词。对话短，留白多。不写心理解说，用动作呈现。"
style_card: baimiao
style_intensity: medium

# status 里代表"已故"的取值。写进对照锚点，防止死人开口。
death_states: []

world_rules:
  - "南宋绍兴年间，临安到洛阳需走一个多月，途中要过关隘验凭。"
  - "书信靠驿传，寄一封到洛阳往返约两月，常常丢失。"
  - "沈砚三年前确实到了洛阳，但被卷入一桩公案，行动受限，信被扣下。"

# 世界标志词，只给离线计分卡数命中用。要短、要专有。
world_terms:
  - "临安"
  - "洛阳"
  - "绣坊"
  - "驿"
  - "关隘"
  - "府衙"
  - "路引"
  - "盘缠"

taboos:
  - "不许出现现代物件、现代用语。"
  - "不许让林晚在到洛阳之前就知道沈砚被扣信的真相。"
  - "不许用穿越、灵异、复活等超自然设定。"

state_fields:
  # 闭集，不是自由文本。真模型上写出过"洛阳·府衙外·石阶"和"门内"——
  # 同一个地方两种写法，把 L1 的位置冲突检查、锚点里的所在地、
  # 计分卡的隔空同框全打瘸了。台阶第几级属于正文里的位置细节，不是账本事实。
  #
  # 抽取器无权写：地点的权威是质检，它看得见动作。抽取器只能事后从正文里猜，
  # 而它猜错过——最后一场没人移动、质检没提，它就把两个人都写回了临安，
  # 其中一个人根本没离开过洛阳。
  - field_id: location
    kind: ENUM
    allowed_values: ["临安", "洛阳", "途中"]
    extractor_locked: true
  - field_id: current_goal
    kind: TEXT
  - field_id: status
    kind: ENUM
    allowed_values: ["健康", "受伤", "疲惫", "失踪"]
  - field_id: affiliation
    kind: TEXT
  - field_id: 随身物
    kind: TEXT_LIST
    max_items: 8

characters:
  - owner_id: "世界"
    persona: "客观世界记录。只存发生了什么，不参演。"
    voice: ""

  - owner_id: "林晚"
    persona: >-
      二十四岁，临安城南的绣娘。手稳，话少，认死理。
      父母早亡，靠一手苏绣养活自己。三年来每月往洛阳寄一封信，没收到过回信。
      她不哭，只是把每封没回的信都留了副本，攒了三十六封。
    voice: "话短，常常用动作代替回答。被问急了会反问。"
    secrets:
      - "她已经把绣坊的活计全推了，盘缠是卖了母亲留的一对银镯换的。"
      - "她其实做过最坏的打算：如果沈砚已经娶了别人，她就看一眼就走。"
    initial_state:
      location: "临安"
      current_goal: "攒够盘缠，去洛阳找沈砚"
      status: "健康"
      随身物: ["三十六封信的副本", "一只旧绣绷"]

  - owner_id: "沈砚"
    persona: >-
      二十七岁，三年前赴洛阳任小吏。读书人，寡言，容易把话咽回去。
      到洛阳第二年被牵进一桩粮案，虽未定罪，但被扣在府衙不得离城，通信也被截。
      他写过十一封信，一封都没出去。
    voice: "说话工整，容易讲道理，紧张时会解释太多。"
    secrets:
      - "他被扣在洛阳，信件被府衙截留，这件事他无法对外说明。"
      - "他一直留着林晚寄来的第一封信，藏在官册夹层里。"
    initial_state:
      location: "洛阳"
      current_goal: "把实情递出去，让临安那边知道自己还活着"
      status: "疲惫"
      affiliation: "洛阳府衙小吏"
      随身物: ["林晚寄来的第一封信", "未寄出的十一封信"]

  - owner_id: "周娘子"
    persona: >-
      四十余岁，临安绣坊的东家。见过世面，说话直。
      她替林晚可惜，也劝过她别等，但真到林晚要走时，还是塞了钱给她。
    voice: "直白，爱用俗语，心软嘴硬。"
    secrets:
      - "她两年前托一个跑洛阳的行商打听过沈砚，行商回话说人还在，但她没敢告诉林晚，怕是空口。"
    initial_state:
      location: "临安"
      current_goal: "劝住林晚，或者至少让她走得稳当些"
      status: "健康"
      affiliation: "临安绣坊东家"
